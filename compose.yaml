name: assignments-app

services:
  web:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - assignments
      - submissions
      - db

  assignments:
    build:
      context: ./assignments-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://db:27017

  submissions:
    build:
      context: ./submission-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ROCKET_ADDRESS=0.0.0.0

  db:
    image: mongo
    ports:
      - "27017:27017"

